# Smithery configuration for Calculadora Jurídica
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_calculo

name: calculo-mcp
displayName: "Calculadora Jurídica"
description: >
  Calculadoras jurídicas automáticas: atualização monetária e liquidação de débitos (correção por IPCA, INPC, IGP-M, SELIC, TR e outros índices oficiais + juros, multa e honorários), com índices buscados ao vivo no BACEN e IBGE. Sem credencial; hospedado pela plataforma. Ideal para liquidação de sentença, execução, ação de cobrança e atualização de aluguel/pensão.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/calculo-mcp
repository: https://github.com/mcp-dir/calculo-mcp

tags:
  - calculo
  - brazil
  - med
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_calculo

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_calculo/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
